name: Scheduler Diagnostic

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  scheduler-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify scheduler
        run: |
          echo "Scheduler diagnostic started"
          echo "Trigger: ${{ github.event_name }}"
          date -u
